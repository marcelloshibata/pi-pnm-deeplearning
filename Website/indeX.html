<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <title>PneumoDetect</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/footer.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="container">
        <!--  -->
        <section class="lateralHero">
          <div class="apresentacao">
            <h4>Diagnóstico assistido por IA</h4>
            <h1>
              Radiografias <br />
              analisadas com <br />
              precisão clínica.
            </h1>
            <h5>
              Envie a radiografia de tórax e receba em <br />
              segundos um relatório gerado por deep learning <br />
              para auxiliar no diagnóstico de pneumonia.
            </h5>
          </div>
        </section>
        <!--  -->
        <section class="contLogin">
          <div class="cardLogin">
            <h1><strong>Acesso à plataforma</strong></h1>
            <p>
              Entre com suas credenciais para enviar exames <br> e visualizar
              relatórios
            </p>
            <div class="cardButton">
              <button class="tipoUsuario">Sou Paciente</button>
              <button class="tipoUsuario">Sou Profissional</button>
            </div>
            <label class="lblLogin" for="email">E-mail </label>
            <input class="iptLogin" type="email" id="email" />

            <label class="lblLogin" for="senha"
              >Senha <a id="redefinirSenha" href="#redefinirSenha"> Esqueceu a Senha?</a></label
            >

            <input class="iptLogin" type="password" id="senha" />

            <button class="btnEntForm">Entrar na plataforma</button>

            <button class="btnCadForm">Criar conta gratuitamente</button>
          </div>
        </section>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
